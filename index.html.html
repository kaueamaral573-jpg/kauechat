<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente Virtual</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="topo">
      <h1>Assistente Virtual</h1>
      <button id="btn-nova" type="button">Limpar chat</button>
    </header>

    <main id="mensagens" class="mensagens" aria-live="polite">
      <p id="vazio" class="vazio">Olá! Faça uma pergunta no campo abaixo e vamos conversar.</p>
    </main>

    <form id="form" class="entrada">
      <textarea id="campo" rows="1" placeholder="Pergunte alguma coisa..." aria-label="Mensagem"></textarea>
      <button id="btn-enviar" type="submit">Mandar</button>
    </form>

  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
